name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: steady
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/steady
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Create a throwaway auth secret for this run
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Create a throwaway invite code for this run
        run: echo "INVITE_CODE=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check-types
      - name: Tone check (PRD section 10)
        run: npm run check:tone
      # Unit tests include database tests (constraints, ownership), so the tables must exist first.
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (high and critical)
        run: npm run audit
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests
        run: npm run e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
